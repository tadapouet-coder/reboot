<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reboot V2</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><h1>🔄 Reboot V2</h1><div class="card"><h2>Check-in quotidien</h2><input id="sleep" type="number" min="1" max="5" placeholder="Sommeil 1-5"><input id="energy" type="number" min="1" max="5" placeholder="Énergie 1-5"><input id="stress" type="number" min="1" max="5" placeholder="Stress 1-5"><input id="motivation" type="number" min="1" max="5" placeholder="Motivation 1-5"><button onclick="generateDay()">Générer ma journée</button><div id="day"></div></div><div class="card"><h2>Suivi poids</h2><input id="weight" type="number" step="0.1" placeholder="Poids"><button onclick="saveWeight()">Ajouter</button><ul id="weightList"></ul></div><div class="card"><h2>Nutrition du jour</h2><button onclick="generateMeals()">Générer menus</button><div id="meals"></div></div><div class="card"><h2>Habitudes</h2><label><input type="checkbox"> 2L d'eau</label><label><input type="checkbox"> 7000 pas</label><label><input type="checkbox"> Protéines à chaque repas</label><label><input type="checkbox"> Couché avant 23h</label></div><div class="card"><h2>Historique séances</h2><ul id="history"></ul></div></div><script src="app.js"></script></body></html>
